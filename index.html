<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" />
    <title>Pulse is being upgraded</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #07111f;
        color: #f8fafc;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 10%, rgba(58, 177, 255, 0.18), transparent 34rem),
          radial-gradient(circle at 85% 90%, rgba(124, 58, 237, 0.16), transparent 30rem),
          #07111f;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      .panel {
        width: min(100%, 46rem);
        padding: clamp(2rem, 7vw, 4.5rem);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 2rem;
        background: rgba(15, 28, 45, 0.82);
        box-shadow: 0 2rem 6rem rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .mark {
        display: inline-grid;
        place-items: center;
        width: 4rem;
        height: 4rem;
        margin-bottom: 1.75rem;
        border-radius: 1.25rem;
        background: linear-gradient(135deg, #38bdf8, #7c3aed);
        box-shadow: 0 1rem 2.5rem rgba(56, 189, 248, 0.22);
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.08em;
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #7dd3fc;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 8vw, 4.25rem);
        line-height: 1.02;
        letter-spacing: -0.055em;
      }

      .body {
        max-width: 35rem;
        margin: 1.5rem auto 0;
        color: #cbd5e1;
        font-size: clamp(1rem, 2.5vw, 1.2rem);
        line-height: 1.7;
      }

      .soon {
        margin: 2rem 0 0;
        color: #f8fafc;
        font-weight: 650;
      }

      @media (max-width: 480px) {
        main { padding: 1rem; }
        .panel { border-radius: 1.5rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="maintenance-title">
        <div class="mark" aria-hidden="true">P</div>
        <p class="eyebrow">Kampaign Kings internal platform</p>
        <h1 id="maintenance-title">Pulse is being upgraded</h1>
        <p class="body">
          We’re rebuilding Pulse to deliver a faster, more secure, and more reliable experience.
        </p>
        <p class="soon">The platform will be back soon.</p>
      </section>
    </main>
  </body>
</html>
